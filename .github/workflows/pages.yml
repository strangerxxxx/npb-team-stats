name: Update and deploy

on:
  schedule:
    - cron: "0 7 * 3-11 *"
      timezone: "Asia/Tokyo"
    - cron: "*/15 18-23 * 3-11 1-5"
      timezone: "Asia/Tokyo"
    - cron: "*/15 13-23 * 3-11 0,6"
      timezone: "Asia/Tokyo"
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.season.outputs.should_update }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: season
        env:
          REQUIRE_SEASON_WINDOW: ${{ github.event_name == 'schedule' }}
        run: python scripts/ci_should_update.py

  data:
    needs: gate
    if: needs.gate.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Scrape and compute
        run: python scripts/scrape.py && python scripts/compute.py

      - uses: actions/upload-artifact@v4
        with:
          name: public-data
          path: public/data
          retention-days: 1

  pages:
    needs: data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: public-data
          path: public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  vercel:
    needs: data
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: public-data
          path: public/data

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@43

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy
        run: vercel deploy --prebuilt --prod --yes

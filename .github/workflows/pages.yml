name: Deploy frontend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_BASE_URL: ${{ secrets.VITE_DATA_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

  vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Skip when Vercel is not configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN が未設定のためスキップします。"

      - if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v4

      - if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        if: env.VERCEL_TOKEN != ''
        run: npm ci

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install -g vercel@43

      - name: Pull Vercel environment
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production

      - name: Build
        if: env.VERCEL_TOKEN != ''
        env:
          VITE_DATA_BASE_URL: ${{ secrets.VITE_DATA_BASE_URL }}
        run: vercel build --prod

      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --yes

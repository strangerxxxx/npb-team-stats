AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: NPB team-stats data updater (Lambda) and public data bucket (S3)

Globals:
  Function:
    Timeout: 900
    MemorySize: 2048

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub npb-team-stats-data-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
              - Content-Length
            MaxAge: 300

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadData
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub ${DataBucket.Arn}/data/*

  UpdateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: npb-update
      DockerContext: .
      Dockerfile: lambda/Dockerfile
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket
          DATA_PREFIX: data
          NPB_SCORES_DIR: /tmp/npb/scores
          NPB_OUTPUT_DIR: /tmp/npb/data
          NPB_SIM_BIN: /var/task/bin/npb_sim
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeUpdateFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt UpdateFunction.Arn

  SchedulerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateFunction
      Action: lambda:InvokeFunction
      Principal: scheduler.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  MorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Daily 07:00 JST during March-November
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(0 7 * 3-11 ? *)
      ScheduleExpressionTimezone: Asia/Tokyo
      State: ENABLED
      Target:
        Arn: !GetAtt UpdateFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"trigger":"schedule"}'

  WeekdaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Weekdays every 15 minutes 18:00-23:45 JST during March-November
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(0/15 18-23 ? 3-11 MON-FRI *)
      ScheduleExpressionTimezone: Asia/Tokyo
      State: ENABLED
      Target:
        Arn: !GetAtt UpdateFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"trigger":"schedule"}'

  WeekendSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Weekends every 15 minutes 13:00-23:45 JST during March-November
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(0/15 13-23 ? 3-11 SAT,SUN *)
      ScheduleExpressionTimezone: Asia/Tokyo
      State: ENABLED
      Target:
        Arn: !GetAtt UpdateFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"trigger":"schedule"}'

Outputs:
  DataBucketName:
    Description: Public data bucket
    Value: !Ref DataBucket
  DataBaseUrl:
    Description: Set this as VITE_DATA_BASE_URL for the frontend
    Value: !Sub https://${DataBucket}.s3.${AWS::Region}.amazonaws.com/data
  UpdateFunctionArn:
    Description: Data updater Lambda
    Value: !GetAtt UpdateFunction.Arn
